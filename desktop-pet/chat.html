<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; connect-src 'self' http://localhost:5000">
  <title>聊天</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .login-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-box {
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      width: 100%;
      max-width: 300px;
    }
    .login-box h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }
    .form-group {
      margin-bottom: 15px;
    }
    .form-group label {
      display: block;
      margin-bottom: 5px;
      color: #666;
      font-size: 14px;
    }
    .form-group input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
    }
    .btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .btn:hover {
      transform: translateY(-2px);
    }
    .chat-container {
      flex: 1;
      display: none;
      flex-direction: column;
      background: #f5f5f5;
    }
    .chat-header {
      background: white;
      padding: 15px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .chat-header .user-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .chat-header .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #ddd;
    }
    .online-status {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ccc;
    }
    .online-status.active {
      background: #4caf50;
    }
    .messages-container {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
    }
    .message {
      margin-bottom: 15px;
      display: flex;
      gap: 10px;
    }
    .message.sent {
      flex-direction: row-reverse;
    }
    .message-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #ddd;
      flex-shrink: 0;
    }
    .message-content {
      max-width: 70%;
    }
    .message-bubble {
      background: white;
      padding: 10px 14px;
      border-radius: 16px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.1);
    }
    .message.sent .message-bubble {
      background: #667eea;
      color: white;
    }
    .message-time {
      font-size: 11px;
      color: #999;
      margin-top: 4px;
    }
    .message.sent .message-time {
      text-align: right;
    }
    .input-container {
      background: white;
      padding: 15px;
      display: flex;
      gap: 10px;
      box-shadow: 0 -2px 5px rgba(0,0,0,0.1);
    }
    .input-container input {
      flex: 1;
      padding: 10px 15px;
      border: 1px solid #ddd;
      border-radius: 20px;
      font-size: 14px;
      outline: none;
    }
    .input-container input:focus {
      border-color: #667eea;
    }
    .input-container .send-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }
    .error-msg {
      color: #f44336;
      font-size: 13px;
      text-align: center;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="login-container" id="loginContainer">
    <div class="login-box">
      <h2>小星星聊天</h2>
      <div class="form-group">
        <label>用户名</label>
        <input type="text" id="username" placeholder="输入用户名" value="user1">
      </div>
      <div class="form-group">
        <label>密码</label>
        <input type="password" id="password" placeholder="输入密码" value="951106">
      </div>
      <button class="btn" onclick="login()">登录</button>
      <div class="error-msg" id="errorMsg"></div>
    </div>
  </div>

  <div class="chat-container" id="chatContainer">
    <div class="chat-header">
      <div class="user-info">
        <img class="avatar" id="otherAvatar" src="">
        <div>
          <div id="otherNickname" style="font-weight: 500;"></div>
          <div style="display: flex; align-items: center; gap: 5px; font-size: 12px; color: #999;">
            <div class="online-status" id="onlineStatus"></div>
            <span id="onlineText">离线</span>
          </div>
        </div>
      </div>
      <button onclick="logout()" style="background: none; border: none; color: #999; cursor: pointer;">退出</button>
    </div>
    <div class="messages-container" id="messagesContainer"></div>
    <div class="input-container">
      <input type="text" id="messageInput" placeholder="输入消息..." onkeypress="if(event.key==='Enter')sendMessage()">
      <button class="send-btn" onclick="sendMessage()">→</button>
    </div>
  </div>

  <script>
    const API_BASE = 'http://localhost:5000/api'
    let token = localStorage.getItem('token')
    let currentUser = null
    let otherUser = null
    let pollInterval = null

    async function login() {
      const username = document.getElementById('username').value
      const password = document.getElementById('password').value
      const errorMsg = document.getElementById('errorMsg')
      
      try {
        const res = await fetch(`${API_BASE}/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        })
        const data = await res.json()
        
        if (data.code === 0) {
          token = data.data.token
          currentUser = data.data
          localStorage.setItem('token', token)
          localStorage.setItem('currentUser', JSON.stringify(currentUser))
          showChat()
        } else {
          errorMsg.textContent = data.msg || '登录失败'
        }
      } catch (err) {
        errorMsg.textContent = '网络错误，请检查后端是否启动'
      }
    }

    async function showChat() {
      document.getElementById('loginContainer').style.display = 'none'
      document.getElementById('chatContainer').style.display = 'flex'
      await loadMessages()
      pollInterval = setInterval(loadMessages, 3000)
    }

    async function loadMessages() {
      if (!token) return
      
      try {
        const res = await fetch(`${API_BASE}/messages`, {
          headers: { 'Authorization': `Bearer ${token}` }
        })
        const data = await res.json()
        
        if (data.code === 0) {
          renderMessages(data.data)
          if (data.chat_meta) {
            otherUser = data.chat_meta.other_user
            updateOtherUserInfo(data.chat_meta)
          }
        } else if (data.code === 401) {
          logout()
        }
      } catch (err) {
        console.error('加载消息失败:', err)
      }
    }

    function renderMessages(messages) {
      const container = document.getElementById('messagesContainer')
      container.innerHTML = messages.map(msg => {
        const isSent = msg.sender_id === currentUser.id
        const time = new Date(msg.timestamp).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' })
        return `
          <div class="message ${isSent ? 'sent' : ''}">
            <img class="message-avatar" src="${API_BASE.replace('/api', '')}${isSent ? currentUser.avatar : (otherUser?.avatar || '')}">
            <div class="message-content">
              <div class="message-bubble">${escapeHtml(msg.content)}</div>
              <div class="message-time">${time}</div>
            </div>
          </div>
        `
      }).join('')
      container.scrollTop = container.scrollHeight
    }

    function updateOtherUserInfo(meta) {
      document.getElementById('otherNickname').textContent = meta.other_user.nickname
      document.getElementById('otherAvatar').src = `${API_BASE.replace('/api', '')}${meta.other_user.avatar}`
      document.getElementById('onlineStatus').className = `online-status ${meta.is_online ? 'active' : ''}`
      document.getElementById('onlineText').textContent = meta.is_online ? '在线' : '离线'
    }

    async function sendMessage() {
      const input = document.getElementById('messageInput')
      const content = input.value.trim()
      if (!content || !otherUser) return
      
      try {
        const res = await fetch(`${API_BASE}/messages`, {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ 
            receiver_id: otherUser.id, 
            content,
            msg_type: 'text'
          })
        })
        const data = await res.json()
        if (data.code === 0) {
          input.value = ''
          await loadMessages()
        }
      } catch (err) {
        console.error('发送消息失败:', err)
      }
    }

    function logout() {
      token = null
      currentUser = null
      otherUser = null
      localStorage.removeItem('token')
      localStorage.removeItem('currentUser')
      if (pollInterval) clearInterval(pollInterval)
      document.getElementById('loginContainer').style.display = 'flex'
      document.getElementById('chatContainer').style.display = 'none'
    }

    function escapeHtml(text) {
      const div = document.createElement('div')
      div.textContent = text
      return div.innerHTML
    }

    if (token) {
      currentUser = JSON.parse(localStorage.getItem('currentUser') || 'null')
      if (currentUser) {
        showChat()
      } else {
        logout()
      }
    }
  </script>
</body>
</html>
